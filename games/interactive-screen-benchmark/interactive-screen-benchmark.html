function getWebGLInfo(){
  try{
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if(!gl) return { vendor:'unavailable', renderer:'unavailable' };

    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

    return {
      vendor: String(vendor || 'unknown'),
      renderer: String(renderer || 'unknown')
    };
  }catch(_){
    return { vendor:'error', renderer:'error' };
  }
}

function estimateRefreshHzFromSamples(){
  const recent = state.fpsSamples
    .filter(v => Number.isFinite(v) && v > 0)
    .slice(-180);

  if(!recent.length) return 0;
  return Math.round(percentile(recent, 0.90));
}

function buildSinePath(cx, cy, amp, width, points = 80){
  const arr = [];
  for(let i=0;i<points;i++){
    const t = i / (points - 1);
    const x = cx - width / 2 + t * width;
    const y = cy + Math.sin(t * Math.PI * 2.0) * amp * (0.75 + 0.25 * Math.cos(t * Math.PI));
    arr.push({x, y});
  }
  return arr;
}

function buildDualPath(side){
  const cyTop = state.vh * 0.30;
  const cyBottom = state.vh * 0.74;
  const cx = side === 'left' ? state.vw * 0.30 : state.vw * 0.70;
  const amp = state.vw * 0.06;
  const path = [];
  const points = 72;

  for(let i=0;i<points;i++){
    const t = i / (points - 1);
    const y = cyTop + t * (cyBottom - cyTop);
    const x = cx + Math.sin(t * Math.PI * 2.0 + (side === 'left' ? 0 : 1.1)) * amp;
    path.push({x, y});
  }
  return path;
}

function startRun(){
  resetMetrics();
  updateModeButtonLabel();
  overlay.classList.add('hidden');
  summaryLayer.classList.add('hidden');
  stageControls.classList.remove('hidden');
  state.initialized=true;state.started=true;
  state.phaseIndex=0;
  state.phase=STAGES[0];
  spawnLatencyTarget(true);
}


function resetRun(){
  if(state.finishSent) return;
  updateModeButtonLabel();
  state.started=false;
  state.phase='intro';
  state.summary=null;
  showIntro();
}

function abortEarly(){ state.summary=summarize(true); state.phase='summary'; showSummary(); }
function commitResult(){ if(!state.finishSent) finishGame(state.summary ? state.summary.result : 0); }
function finishGame(result){
  if(state.finishSent) return;

  state.finishSent = true;
  state.finished = true;
  state.started = false;

  releasePointers();

  dom.game.style.pointerEvents = 'none';
  dom.ui.style.pointerEvents = 'none';
  overlay.style.pointerEvents = 'none';
  summaryLayer.style.pointerEvents = 'none';
  stageControls.style.pointerEvents = 'none';

  try{
    parent.postMessage({
      type:'gameResult',
      result: Number.isFinite(Number(result)) ? Number(result) : 0
    }, '*');
  }catch(_){}
}
function advanceStage(){
  if(!state.started || state.phase==='summary') return;
  if(state.phaseIndex >= STAGES.length-1){ finishStages(); return; }

  state.phaseIndex += 1;
  state.phase = STAGES[state.phaseIndex];
  state.phaseElapsed = 0;
  releasePointers();
  if(state.phase === 'autodiag' && state.autoDiag && state.autoDiag.overrideConfig){
    state.autoDiag.overrideConfig = null;
    applyVisualMode();
  }

  if(state.phase === 'tracepath') resetTraceStage();
  if(state.phase === 'autodiag') resetAutoDiagStage();
  if(state.phase === 'dualpaths') resetDualPathsStage();
}
function finishStages(){ state.summary=summarize(false); state.phase='summary'; showSummary(); }
function resetTraceStage(){
  state.trace.activeId = null;
  state.pointers.clear();
  state.pointerCountNow = 0;
  state.trace.points = [];
  state.trace.progress = 0;
  state.trace.covered = 0;
  state.trace.deviationSum = 0;
  state.trace.deviationMax = 0;
  state.trace.deviationSamples = 0;
  state.trace.breaks = 0;
  state.trace.capturePoints = 0;
  state.trace.completed = false;state.trace.nextIndex=0;state.trace.previous=null;state.trace.tracking=false;state.trace.outside=false;state.trace.normalDeviationSum=0;
}

function toggleStarsBackground(){

  updateModeButtonLabel();
}

function resetDualPathsStage(){

  state.dualpaths.right.activeId = null;

  state.dualpaths.left.progress = 0;
  state.dualpaths.left.covered = 0;
  state.dualpaths.left.deviationSum = 0;
  state.dualpaths.left.deviationSamples = 0;

function resetAutoDiagStage(){
  state.autoDiag = {
    introElapsed:0,
    caseIndex:-1,
    caseElapsed:0,
    fpsSamples:[],
    frameSamples:[],
    results:[],
    verdict:'',
    overrideConfig:null
  };
  applyVisualMode();
}

function getAutoDiagCase(){
  if(state.autoDiag.caseIndex < 0) return null;
  return AUTO_DIAG_CASES[state.autoDiag.caseIndex] || null;
}

function applyAutoDiagOverride(config){
  state.autoDiag.overrideConfig = config ? { ...config } : null;
  applyVisualMode();
}

function startAutoDiagCase(){
  const testCase = getAutoDiagCase();
  if(!testCase) return;

  state.autoDiag.caseElapsed = 0;
  state.autoDiag.fpsSamples = [];
  state.autoDiag.frameSamples = [];
  applyAutoDiagOverride(testCase.config);
}

function pctGain(base, value){
  if(!base || !Number.isFinite(base) || base <= 0) return 0;
  return ((value - base) / base) * 100;
}

function analyzeAutoDiagResults(results){
  if(!results || !results.length) return 'Автодиагностика не собрала данные.';

  const byId = Object.fromEntries(results.map(r => [r.id, r]));
  const base = byId.baseline?.avgFps || 0;

  if(!base) return 'Не удалось вычислить базовый FPS для автодиагностики.';

  // Compare only matching scenes; HUD OFF also disables blur, so its reference is NO BLUR.
  const pairs=[['no_blur','baseline','без blur'],['hud_off','no_blur','без рисуемого HUD'],['flat','hud_off','без эффектов сцены'],['scale_075','no_blur','рендер 0.75x'],['scale_050','no_blur','рендер 0.50x']];
  const factors=pairs.filter(([id,reference])=>byId[id]&&byId[reference]).map(([id,reference,label])=>({id,label,gain:pctGain(byId[reference].avgFps,byId[id].avgFps)})).sort((a,b)=>b.gain-a.gain);
  if(!factors.length)return 'Недостаточно сопоставимых режимов.';

  const top = factors[0];
  const strong = factors.filter(x => x.gain >= 10);

  let main = '';
  if(top.gain < 8){
    main = 'Заметного прироста между режимами нет. Возможен предел частоты обновления; причину ограничений по этим данным определить нельзя.';
  } else if(top.id === 'scale_050' || top.id === 'scale_075'){
    main = 'В этой попытке больше всего FPS дал рендер с меньшим количеством пикселей. Это наблюдение не определяет единственную причину ограничения производительности.';
  } else if(top.id === 'no_blur'){
    main = 'В этой попытке наибольший прирост FPS получен без blur у панелей.';
  } else if(top.id === 'hud_off'){
    main = 'В этой попытке наибольший прирост FPS получен без рисуемого HUD, по сравнению с режимом без blur.';
  } else if(top.id === 'flat'){
    main = 'В этой попытке наибольший прирост FPS получен после отключения группы эффектов сцены.';
  }

  if(!strong.length) return main;

  const tail = strong
    .map(x => `${x.label} (+${Math.round(x.gain)}%)`)
    .join(', ');

  return `${main} Сильные факторы: ${tail}.`;
}

function finishAutoDiagCase(){
  const testCase = getAutoDiagCase();
  if(!testCase) return;

  const fpsSamples = state.autoDiag.fpsSamples.filter(v => Number.isFinite(v) && v > 0);
  const frameSamples = state.autoDiag.frameSamples.filter(v => Number.isFinite(v) && v > 0);

  state.autoDiag.results.push({
    id:testCase.id,
    title:testCase.title,
    avgFps: frameSamples.length ? 1000/avg(frameSamples) : 0,
    minFps: fpsSamples.length ? Math.min(...fpsSamples) : 0,
    p95FrameMs: frameSamples.length ? percentile(frameSamples, 0.95) : 0
  });

  state.autoDiag.caseIndex += 1;

  if(state.autoDiag.caseIndex >= AUTO_DIAG_CASES.length){
    state.autoDiag.verdict = analyzeAutoDiagResults(state.autoDiag.results);
    applyAutoDiagOverride(null);
    advanceStage();
    return;
  }

  startAutoDiagCase();
}

function updateAutoDiag(dt){
  if(state.autoDiag.introElapsed < CFG.autoDiagIntroSec){
    state.autoDiag.introElapsed += dt;
    return;
  }

  if(state.autoDiag.caseIndex < 0){
    state.autoDiag.caseIndex = 0;
    startAutoDiagCase();
  }

  const testCase = getAutoDiagCase();
  if(!testCase) return;

  state.autoDiag.caseElapsed += dt;
  state.autoDiag.fpsSamples.push(state.fpsValue);
  state.autoDiag.frameSamples.push(state.lastFrameTimeMs);

  if(state.autoDiag.caseElapsed >= CFG.autoDiagCaseSec){
    finishAutoDiagCase();
  }
}

function getAutoDiagRemainingSec(){
  const introLeft = Math.max(0, CFG.autoDiagIntroSec - state.autoDiag.introElapsed);

  if(state.autoDiag.caseIndex < 0){
    return introLeft + AUTO_DIAG_CASES.length * CFG.autoDiagCaseSec;
  }

  const currentLeft = Math.max(0, CFG.autoDiagCaseSec - state.autoDiag.caseElapsed);
  const afterCurrent = Math.max(0, AUTO_DIAG_CASES.length - state.autoDiag.caseIndex - 1) * CFG.autoDiagCaseSec;

  return introLeft + currentLeft + afterCurrent;
}

function drawAutoDiagWorld(){
  const cfg = getVisualModeConfig();
  wctx.clearRect(0,0,state.vw,state.vh);

  const s = state.scale;
  const t = state.totalElapsed;

  // Instructions are outside the canvas; the load scene uses the available field.
  const topSafe = 24 * s;
  const bottomSafe = 36 * s;
  const drawTop = topSafe;
  const drawBottom = state.vh - bottomSafe;
  const drawHeight = Math.max(80 * s, drawBottom - drawTop);

  // Лёгкий фон только ниже интерфейса
  wctx.save();
  wctx.beginPath();
  wctx.rect(0, drawTop, state.vw, drawHeight);
  wctx.clip();

  wctx.strokeStyle = 'rgba(255,255,255,.06)';
  wctx.lineWidth = 1 * s;

  for(let x = 0; x < state.vw; x += 80 * s){
    wctx.beginPath();
    wctx.moveTo(x, drawTop);
    wctx.lineTo(x, drawBottom);
    wctx.stroke();
  }

  for(let y = drawTop; y < drawBottom; y += 80 * s){
    wctx.beginPath();
    wctx.moveTo(0, y);
    wctx.lineTo(state.vw, y);
    wctx.stroke();
  }

  for(let i=0;i<54;i++){
    const k = i + 1;

    const x =
      state.cx +
      Math.sin(t * (0.45 + i * 0.01) + i * 0.7) * state.vw * 0.34;

    // Центр колебаний только внутри допустимой области
    const yCenter = drawTop + drawHeight * 0.5;
    const yAmplitude = drawHeight * 0.28;

    const y =
      yCenter +
      Math.cos(t * (0.38 + i * 0.008) + i * 0.5) * yAmplitude;

    const r = (10 + (i % 5) * 6) * s;

    if(cfg.gradientsEnabled){
      const g = wctx.createRadialGradient(x, y, r * 0.1, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,.95)');
      g.addColorStop(0.35, `rgba(${120 + (i % 80)},${170 + (i % 50)},255,.92)`);
      g.addColorStop(1, `rgba(${80 + (i % 60)},${110 + (i % 70)},220,.28)`);
      wctx.fillStyle = g;
    } else {
      wctx.fillStyle = `rgba(${120 + (i % 80)},${170 + (i % 50)},255,.72)`;
    }

    wctx.beginPath();
    wctx.arc(x, y, r, 0, Math.PI * 2);
    wctx.fill();

    if(cfg.textsEnabled && i < 12){
      wctx.fillStyle = 'rgba(255,255,255,.88)';
      wctx.font = `700 ${Math.round(14*s)}px Inter,system-ui,sans-serif`;
      wctx.textAlign = 'center';
      wctx.fillText(`N${k}`, x, y - r - 8*s);
      wctx.textAlign = 'left';
    }
  }

  if(cfg.textsEnabled){
    for(let i=0;i<6;i++){
      const x = 40*s + (i % 3) * 250*s;
      const y = drawTop + 24*s + Math.floor(i / 3) * 110*s;

      roundRect(
        wctx,
        x,
        y,
        220*s,
        74*s,
        18*s,
        'rgba(7,17,31,.42)',
        'rgba(255,255,255,.08)'
      );

      wctx.fillStyle = '#eef6ff';
      wctx.font = `900 ${Math.round(20*s)}px Inter,system-ui,sans-serif`;
      wctx.fillText(`SCENE ${i+1}`, x + 14*s, y + 28*s);

      wctx.fillStyle = 'rgba(159,180,204,.96)';
      wctx.font = `800 ${Math.round(14*s)}px Inter,system-ui,sans-serif`;
      wctx.fillText(`moving objects / labels / gradients`, x + 14*s, y + 54*s);
    }
  }

  wctx.restore();
}

function drawAutoDiagHud(){
  const cfg = getVisualModeConfig();
  hctx.clearRect(0,0,state.vw,state.vh);
  if(!cfg.hudEnabled) return;

  const s = topHudLayout().s;
  const topY = 24*s;

  for(let i=0;i<6;i++){
    const x = 24*s + i * 127*s;
    drawGlass(x, topY, 115*s, 90*s);

    if(cfg.textsEnabled){
      hctx.fillStyle = 'rgba(159,180,204,.96)';
      hctx.font = `800 ${Math.round(14*s)}px Inter,system-ui,sans-serif`;
      hctx.fillText(`P${i+1}`, x + 10*s, topY + 22*s);

      hctx.fillStyle = '#eef6ff';
      hctx.font = `900 ${Math.round(22*s)}px Inter,system-ui,sans-serif`;
      hctx.fillText(`${Math.round((state.fpsDisplay || state.fpsValue) + i)}`, x + 10*s, topY + 54*s);
    }
  }

  for(let i=0;i<4;i++){
    const x = 24*s + i * 180*s;
    const y = state.vh - 170*s;

    drawGlass(x, y, 160*s, 110*s);

    const bars = 14;
    const barW = 7*s;
    const gap = 3*s;

    for(let b=0;b<bars;b++){
      const bh = (20 + ((b * 13 + i * 17 + Math.floor(state.totalElapsed * 30)) % 60)) * s * 0.6;
      hctx.fillStyle = 'rgba(102,222,255,.72)';
      hctx.fillRect(x + 12*s + b * (barW + gap), y + 88*s - bh, barW, bh);
    }

    if(cfg.textsEnabled){
      hctx.fillStyle = 'rgba(159,180,204,.96)';
      hctx.font = `800 ${Math.round(14*s)}px Inter,system-ui,sans-serif`;
      hctx.fillText(`HUD ${i+1}`, x + 12*s, y + 22*s);
    }
  }
}

function drawAutoDiagOverlay(){
  const s = state.scale;
  const introLeft = Math.max(0, CFG.autoDiagIntroSec - state.autoDiag.introElapsed);
  const totalLeft = getAutoDiagRemainingSec();

  const boxW = 560 * s;
  const boxH = 170 * s;
  const boxX = state.cx - boxW / 2;
  const boxY = 245 * s;

  const progress =
    Math.max(0, state.autoDiag.caseIndex) +
    Math.min(1, state.autoDiag.caseElapsed / CFG.autoDiagCaseSec);

  const ratio = state.autoDiag.caseIndex < 0
    ? 0
    : progress / AUTO_DIAG_CASES.length;

  // Сначала рисуем прогресс, чтобы он оказался ниже интерфейса по слою
  roundRect(
    hctx,
    state.cx - 220*s,
    boxY + boxH + 18*s,
    440*s,
    16*s,
    999*s,
    'rgba(255,255,255,.08)',
    'rgba(255,255,255,.10)'
  );

  roundRect(
    hctx,
    state.cx - 220*s,
    boxY + boxH + 18*s,
    440*s * clamp(ratio, 0, 1),
    16*s,
    999*s,
    'rgba(127,244,181,.88)',
    null
  );

  // Потом интерфейс поверх
  roundRect(
    hctx,
    boxX,
    boxY,
    boxW,
    boxH,
    22 * s,
    'rgba(7,17,31,.62)',
    'rgba(255,255,255,.10)'
  );

  hctx.fillStyle = '#eef6ff';
  hctx.textAlign = 'center';
  hctx.font = `900 ${Math.round(22*s)}px Inter,system-ui,sans-serif`;
  hctx.fillText('НИЧЕГО НАЖИМАТЬ НЕ НУЖНО', state.cx, boxY + 36*s);

  hctx.fillStyle = 'rgba(159,180,204,.96)';
  hctx.font = `800 ${Math.round(18*s)}px Inter,system-ui,sans-serif`;

  if(introLeft > 0){
    hctx.fillText(`Автодиагностика начнётся через ${introLeft.toFixed(1)} с`, state.cx, boxY + 72*s);
    hctx.fillText(`Ориентировочно осталось ${totalLeft.toFixed(1)} с`, state.cx, boxY + 102*s);
  } else {
    const testCase = getAutoDiagCase();
    const caseLeft = Math.max(0, CFG.autoDiagCaseSec - state.autoDiag.caseElapsed);

    hctx.fillText(`Сейчас идёт проверка: ${testCase ? testCase.title : '-'}`, state.cx, boxY + 72*s);
    hctx.fillText(`До конца этого под-теста: ${caseLeft.toFixed(1)} с`, state.cx, boxY + 102*s);
    hctx.fillText(`Ориентировочно осталось всего: ${totalLeft.toFixed(1)} с`, state.cx, boxY + 132*s);
  }

  if(state.autoDiag.results.length){
    const resBoxW = 620 * s;
    const resBoxH = Math.max(84*s, (state.autoDiag.results.length * 22 + 22) * s);
    const resBoxX = state.cx - resBoxW / 2;
    const resBoxY = boxY + boxH + 52*s;

    roundRect(
      hctx,
      resBoxX,
      resBoxY,
      resBoxW,
      resBoxH,
      20*s,
      'rgba(7,17,31,.52)',
      'rgba(255,255,255,.08)'
    );

    hctx.fillStyle = '#eef6ff';
    hctx.textAlign = 'left';
    hctx.font = `900 ${Math.round(16*s)}px Inter,system-ui,sans-serif`;
    hctx.fillText('УЖЕ ИЗМЕРЕНО:', resBoxX + 18*s, resBoxY + 28*s);

    hctx.fillStyle = 'rgba(159,180,204,.96)';
    hctx.font = `800 ${Math.round(15*s)}px Inter,system-ui,sans-serif`;

    state.autoDiag.results.forEach((r, i) => {
      hctx.fillText(
        `${r.title}: ${Math.round(r.avgFps)} FPS · min ${Math.round(r.minFps)} · p95 ${Math.round(r.p95FrameMs)} ms`,
        resBoxX + 18*s,
        resBoxY + (52 + i * 22)*s
      );
    });
  }

  hctx.textAlign = 'left';
}

function showSummary(){
  overlay.classList.add('hidden');summaryLayer.classList.remove('hidden');stageControls.classList.add('hidden');
  const s=state.summary,pass=s.result===1;
  sum.title.textContent=s.assessment==='incomplete'?'НЕПОЛНЫЕ ДАННЫЕ':pass?'ПРОВЕРКА ПРОЙДЕНА':'РЕЗУЛЬТАТЫ ПРОВЕРКИ';
  sum.title.style.color=s.checks.some(c=>c.severity==='problem')?'var(--bad)':pass?'var(--good)':'var(--warn)';
  sum.subtitle.textContent='Ввод: '+(s.inputTypes.join(', ')||'не определён')+'. Это результаты браузерной проверки, а не заключение о неисправности устройства.';
  sum.body.replaceChildren();sum.body.scrollTop=0;
  const severity=(...labels)=>{
    const values=s.checks.filter(c=>labels.includes(c.label)).map(c=>c.severity);
    return values.includes('problem')?'problem':values.includes('warning')?'warning':'normal';
  };
  const add=(text,status='normal')=>{const line=document.createElement('div');line.className='summary-line';line.dataset.severity=status;line.textContent=text;sum.body.appendChild(line);};
  const legend=document.createElement('div');legend.className='summary-legend';legend.textContent='Красный — проблема по порогам приложения. Жёлтый — предупреждение или неполные данные.';sum.body.appendChild(legend);
  add('Доставка / обработка события: '+(s.medianLatency===null?'не измерена':fmtMs(s.medianLatency)+' (P95 '+fmtMs(s.p95Latency)+')')+'. Полная задержка сенсор → экран здесь не измеряется.',severity('Обработка события'));
  add(s.frameCount?'FPS за активное время (все режимы): '+fmtFps(s.avgFps)+' | минимум: '+fmtFps(s.minFps)+' | P95 кадра: '+fmtMs(s.p95Frame):'Кадры: не измерены',severity('Частота кадров'));
  add('Длинных кадров (>50 мс): '+s.longFrames,severity('Длинные кадры'));
  if(s.autoDiagSummary)add('Автодиагностика: '+s.autoDiagSummary);
  if(s.autoDiagVerdict)add('Вывод автоэтапа: '+s.autoDiagVerdict,s.autoDiagResults.length?'normal':'warning');
  add('Viewport: '+s.viewport+' | screen: '+s.screen+' | DPR: '+s.devicePixelRatio);
  add('CPU threads: '+s.hardwareConcurrency+' | max touch: '+s.maxTouchPoints+' | color depth: '+s.colorDepth);
  add('WebGL renderer: '+s.webglRenderer);
  add('Оценка refresh: '+(s.refreshHzEstimate?s.refreshHzEstimate+' Hz':'не измерена'));
  add('Макс. касаний: '+s.maxPointers+' | стабильно 1 сек: '+s.stablePointers,severity('Мультитач'));
  add('Удержание двух кругов: '+Math.round(s.dualHoldRatio*100)+'% этапа',severity('Два круга'));
  add('Средний шаг координат L/R: '+(s.leftLagAvg===null?'—':Math.round(s.leftLagAvg)+' px')+' / '+(s.rightLagAvg===null?'—':Math.round(s.rightLagAvg)+' px')+' (не задержка)');
  add('Левая зона: серия '+s.leftBest+', всего '+s.leftTotal+' · Правая: серия '+s.rightBest+', всего '+s.rightTotal,severity('Две зоны'));
  add('Перекрытий касаний двух зон: '+s.simultaneousZoneHits);
  add('Падающие цели: '+s.fallHits+' из '+s.fallSpawned,severity('Падающие цели'));
  add('Траектория: '+Math.round(s.traceProgress*100)+'% | среднее отклонение '+(s.traceAvgDeviation===null?'не измерено':Math.round(s.traceAvgDeviation)+' px')+' | разрывы '+s.traceBreaks+' | точки '+s.traceCapturePoints,severity('Траектория'));
  add('Две траектории: '+Math.round(s.dualPathLeftProgress*100)+'% / '+Math.round(s.dualPathRightProgress*100)+'%',severity('Две траектории'));
  s.checks.forEach(check=>add(check.text,check.severity));
  add('Вывод: '+s.verdict,s.assessment==='incomplete'?'warning':s.assessment==='review'?'problem':'normal');
  if(!sum.confirm.classList.contains('hidden'))add('Нажмите «Подтвердить результат», чтобы зафиксировать итог для движка.');
  refreshCardTextLayout();
}

function releasePointers(){
  for(const id of [...state.pointers.keys()])onPointerUp({pointerId:id,type:'release',preventDefault(){}});
  state.trace.activeId=null;state.dualpaths.left.activeId=null;state.dualpaths.right.activeId=null;state.multiTouchHoldTimer=0;
}

function screenToNorm(x,y){const r=dom.world.getBoundingClientRect();return {x:(x-r.left)/r.width,y:(y-r.top)/r.height};}
function recordLatency(e){
  const now=performance.now();let stamp=Number(e.timeStamp);
  if(!Number.isFinite(stamp)||stamp<=0)return;
  if(stamp>1e12)stamp-=performance.timeOrigin||Date.now()-now;
  const delay=now-stamp;if(!Number.isFinite(delay)||delay<0||delay>now)return;
  state.lastInputLatency=delay;state.latencySamples.push(delay);
}

function addMark(x,y,type='touch'){ state.inputMarks.push({x,y,type,t:performance.now()}); if(state.inputMarks.length>40) state.inputMarks.shift(); }
function spawnLatencyTarget(first=false){
  let nx=.14+Math.random()*.72, ny=.26+Math.random()*.56;
  if(!first){ let tries=0; while(tries<10 && hypot2(nx-state.latencyTarget.x, ny-state.latencyTarget.y)<.18){ nx=.14+Math.random()*.72; ny=.26+Math.random()*.56; tries++; } }
  state.latencyTarget.x=nx; state.latencyTarget.y=ny;
}
function pointInZone(x,side){ return side==='left' ? x<.5 : x>=.5; }
function registerZoneTap(side){
  const z=state.tapZones[side], now=performance.now(); z.total += 1;
  z.combo = (!z.lastTap || now-z.lastTap>CFG.comboResetMs) ? 1 : z.combo+1;
  z.lastTap=now; z.best=Math.max(z.best,z.combo); z.secCounter += 1;z.bestPerSec=Math.max(z.bestPerSec,z.secCounter);
}
function updateZoneCombos(now){ ['left','right'].forEach(side=>{ const z=state.tapZones[side]; if(z.combo>0 && z.lastTap && now-z.lastTap>CFG.comboResetMs) z.combo=0; }); }
function rollZoneBins(){ ['left','right'].forEach(side=>{ const z=state.tapZones[side]; z.secBins.push(z.secCounter); while(z.secBins.length>CFG.graphSeconds) z.secBins.shift(); z.secCounter=0; }); }
function rollMultitouchBin(){ state.multitouchBins.push(state.multitouchPeakThisSecond); while(state.multitouchBins.length>CFG.graphSeconds) state.multitouchBins.shift(); state.multitouchPeakThisSecond=0; }
function tryHitLatency(x,y){
 const t=state.latencyTarget,r=t.r*Math.min(state.vw,state.vh);
 if(hypot2((x-t.x)*state.vw,(y-t.y)*state.vh)>r)return false;
 t.hits++;spawnLatencyTarget();return true;
}

function tryHitFalling(x,y){
  const px = x * state.vw, py = y * state.vh;
  for(let i=state.falling.circles.length-1;i>=0;i--){
    const c = state.falling.circles[i];
    if(hypot2(px - c.x, py - c.y) <= c.r){
      state.falling.hits++;
      state.falling[c.bandSpeed].hits++;
      state.falling[c.bandSize].hits++;
      state.falling.circles.splice(i,1);
      return true;
    }
  }
  return false;
}

function distancePointToSegment(px, py, ax, ay, bx, by){
  const abx = bx - ax, aby = by - ay;
  const apx = px - ax, apy = py - ay;
  const ab2 = abx * abx + aby * aby || 1;
  const t = clamp((apx * abx + apy * aby) / ab2, 0, 1);
  const x = ax + abx * t, y = ay + aby * t;
  return hypot2(px - x, py - y);
}

function distanceToPolyline(px, py, path){
  let min = Infinity;
  for(let i=1;i<path.length;i++){
    const a = path[i-1], b = path[i];
    min = Math.min(min, distancePointToSegment(px, py, a.x, a.y, b.x, b.y));
  }
  return min;
}

function nearestPathProgress(px, py, path){
  let bestDist = Infinity;
  let bestIndex = 0;
  for(let i=0;i<path.length;i++){
    const d = hypot2(px - path[i].x, py - path[i].y);
    if(d < bestDist){
      bestDist = d;
      bestIndex = i;
    }
  }
  return {
    progress: bestIndex / Math.max(1, path.length - 1),
    dist: bestDist
  };
}

function classifyFallCircle(c){
  const speedBand = c.bandSpeed;
  const sizeBand = c.bandSize;
  return {speedBand, sizeBand};
}

function countStageSimultaneousTap(p){
  const leftActive = p.x < 0.5;
  const rightActive = p.x >= 0.5;
  if(leftActive){
    for(const other of state.pointers.values()){
      if(p.type==='touch'&&other.type==='touch'&&other.id!==p.id&&other.x >= 0.5){
        state.simultaneousZoneHits += 1;
        break;
      }
    }
  }
  if(rightActive){
    for(const other of state.pointers.values()){
      if(p.type==='touch'&&other.type==='touch'&&other.id!==p.id&&other.x < 0.5){
        state.simultaneousZoneHits += 1;
        break;
      }
    }
  }
}


function assignDragRole(pointerId,x,y){
  const hitR = (CFG.cursorR+20)*state.scale;
  const lx=state.leftCursor.x*state.vw, ly=state.leftCursor.y*state.vh;
  const rx=state.rightCursor.x*state.vw, ry=state.rightCursor.y*state.vh;
  const px=x*state.vw, py=y*state.vh;
  if(state.leftCursor.active===null && hypot2(px-lx,py-ly)<=hitR){ state.leftCursor.active=pointerId; return 'left'; }
  if(state.rightCursor.active===null && hypot2(px-rx,py-ry)<=hitR){ state.rightCursor.active=pointerId; return 'right'; }
  return null;
}

function refreshTouchCount(){
 state.pointerCountNow=[...state.pointers.values()].filter(p=>p.type==='touch').length;state.multiTouchHoldTimer=0;
}
function trackPathSample(track,path,x,y,begin=false){
 if(!path.length||track.completed)return;
 const tolerance=CFG.traceHitRadius*state.scale;
 const d=distanceToPolyline(x,y,path);
 track.deviationSum+=d;track.deviationSamples++;track.deviationMax=Math.max(track.deviationMax||0,d);
 track.normalDeviationSum=(track.normalDeviationSum||0)+d/Math.max(.001,state.scale);
 const outside=d>CFG.traceBreakDist*state.scale;
 if(outside&&!track.outside)track.breaks++;track.outside=outside;
 let i=track.nextIndex||0;
 if(begin){track.previous={x,y};track.tracking=hypot2(x-path[i].x,y-path[i].y)<=tolerance;}
 const prev=track.previous||{x,y};
 if(track.tracking&&!outside){
  // Only consecutive guide points can be covered. A tap at the end cannot skip the path.
  while(i<path.length&&distancePointToSegment(path[i].x,path[i].y,prev.x,prev.y,x,y)<=tolerance)i++;
  track.nextIndex=i;track.progress=i>=path.length?1:Math.max(0,(i-1)/(path.length-1));track.covered=track.progress;track.completed=i===path.length;
 }
 track.previous={x,y};
}
function onPointerDown(e){
  if(!state.started||state.phase==='intro'||state.phase==='summary'||state.finished||state.finishSent) return;
  if(isUiTarget(e.target)||(e.button!==undefined&&e.button!==0))return;
  const position=screenToNorm(e.clientX,e.clientY);if(position.x<0||position.x>1||position.y<0||position.y>1)return;
  recordLatency(e);state.inputTypes.add(e.pointerType||'mouse');state.stageInputs[state.phase]=(state.stageInputs[state.phase]||0)+1;

  const p = screenToNorm(e.clientX, e.clientY);
  if(e.target && e.target.setPointerCapture){
    try{ e.target.setPointerCapture(e.pointerId); }catch(_){}
  } else if(dom.game.setPointerCapture){
    try{ dom.game.setPointerCapture(e.pointerId); }catch(_){}
  }

  const pointer = {id:e.pointerId, type:e.pointerType || 'mouse', x:p.x, y:p.y, role:null};
  state.pointers.set(e.pointerId, pointer);
  refreshTouchCount();

  state.maxSimultaneousPointers = Math.max(state.maxSimultaneousPointers, state.pointerCountNow);
  state.multitouchPeakThisSecond = Math.max(state.multitouchPeakThisSecond, state.pointerCountNow);
  state.multitouchPeakOverall = Math.max(state.multitouchPeakOverall, state.pointerCountNow);

  state.totalPresses += 1;
  addMark(p.x, p.y, pointer.type);

  if(state.phase === 'latency'){
    if(!tryHitLatency(p.x, p.y)) state.latencyTarget.misses++;
  }
  else if(state.phase === 'tapzones'){
    registerZoneTap(pointInZone(p.x,'left') ? 'left' : 'right');
    countStageSimultaneousTap(pointer);
  }
  else if(state.phase === 'dualdrag'){
    pointer.role = assignDragRole(e.pointerId, p.x, p.y);
  }
  else if(state.phase === 'falling'){
    tryHitFalling(p.x, p.y);
  }
  else if(state.phase === 'tracepath'&&state.trace.activeId===null){
    state.trace.activeId=e.pointerId;
    const x=p.x*state.vw,y=p.y*state.vh;state.trace.points.push({x,y});trackPathSample(state.trace,state.trace.path,x,y,true);
  }
  else if(state.phase === 'dualpaths'){
    if(p.x < 0.5 && state.dualpaths.left.activeId === null) state.dualpaths.left.activeId = e.pointerId;
    else if(p.x >= 0.5 && state.dualpaths.right.activeId === null) state.dualpaths.right.activeId = e.pointerId;
    for(const side of ['left','right'])if(state.dualpaths[side].activeId===e.pointerId)trackPathSample(state.dualpaths[side],state.dualpaths[side+'Path'],p.x*state.vw,p.y*state.vh,true);
  }

  e.preventDefault();
}

function onPointerMove(e){
  if(!state.initialized || state.finished || state.finishSent) return;
  const pointer = state.pointers.get(e.pointerId);
  if(!pointer) return;

  const p = screenToNorm(e.clientX, e.clientY);
  pointer.x = p.x;
  pointer.y = p.y;

  state.totalMoves += 1;
  state.moveCounter += 1;

  if(state.phase === 'dualdrag'){
    if(pointer.role === 'left' && state.leftCursor.active === e.pointerId){
      const prevX = state.leftCursor.x * state.vw;
      const prevY = state.leftCursor.y * state.vh;

      state.leftCursor.x = clamp(p.x,.08,.92);
      state.leftCursor.y = clamp(p.y,.20,.92);

      const lag = hypot2(p.x*state.vw - prevX, p.y*state.vh - prevY);
      state.leftCursor.lastFingerLag = lag;
      state.leftCursor.maxFingerLag = Math.max(state.leftCursor.maxFingerLag, lag);
      state.leftCursor.sumFingerLag += lag;
      state.leftCursor.samples += 1;
    }
    if(pointer.role === 'right' && state.rightCursor.active === e.pointerId){
      const prevX = state.rightCursor.x * state.vw;
      const prevY = state.rightCursor.y * state.vh;

      state.rightCursor.x = clamp(p.x,.08,.92);
      state.rightCursor.y = clamp(p.y,.20,.92);

      const lag = hypot2(p.x*state.vw - prevX, p.y*state.vh - prevY);
      state.rightCursor.lastFingerLag = lag;
      state.rightCursor.maxFingerLag = Math.max(state.rightCursor.maxFingerLag, lag);
      state.rightCursor.sumFingerLag += lag;
      state.rightCursor.samples += 1;
    }
  }
  else if(state.phase==='tracepath'&&state.trace.activeId===e.pointerId){
    const x=p.x*state.vw,y=p.y*state.vh;state.trace.points.push({x,y});state.trace.capturePoints=state.trace.points.length;
    trackPathSample(state.trace,state.trace.path,x,y);
  }else if(state.phase==='dualpaths'){
    for(const side of ['left','right'])if(state.dualpaths[side].activeId===e.pointerId)trackPathSample(state.dualpaths[side],state.dualpaths[side+'Path'],p.x*state.vw,p.y*state.vh);
  }

  e.preventDefault();
}

function onPointerUp(e){
 const pointer=state.pointers.get(e.pointerId);if(!pointer)return;
 // Delete first: releasing capture can synchronously emit lostpointercapture.
 state.pointers.delete(e.pointerId);refreshTouchCount();
 const cancelled=e.type==='pointercancel'||e.type==='touchcancel'||e.type==='lostpointercapture';
 if(cancelled)state.pointerCancelCount++;
 for(const cursor of [state.leftCursor,state.rightCursor])if(cursor.active===e.pointerId){cursor.active=null;if(cancelled)cursor.lost++}
 for(const track of [state.trace,state.dualpaths.left,state.dualpaths.right])if(track.activeId===e.pointerId){
  if((cancelled||e.type==='pointerup'||e.type==='touchend')&&track.progress>0&&track.progress<1&&!track.outside)track.breaks++;
  track.activeId=null;track.previous=null;track.tracking=false;track.outside=false;
 }
 if(e.target?.hasPointerCapture?.(e.pointerId)){try{e.target.releasePointerCapture(e.pointerId)}catch(_){}}
 e.preventDefault();
}

function update(dt, rawDt = dt){
  if(!state.initialized) return;

  state.totalElapsed += rawDt;
  if(state.started && state.phase !== 'summary' && state.phase !== 'intro') state.phaseElapsed += rawDt;

  const fps = rawDt > 0 ? 1 / rawDt : 0;
  const frameMs = rawDt * 1000;

  state.fpsValue = fps;
  state.lastFrameTimeMs = frameMs;

  state.fpsSamples.push(fps);
  if(state.fpsSamples.length > 240) state.fpsSamples.shift();

  const frameWindow = [...state.frameTimeSamples.slice(-11),frameMs];
  state.fpsDisplay = frameWindow.length ? 1000/avg(frameWindow) : fps;

  state.frameTimeSamples.push(frameMs);
  if(state.frameTimeSamples.length > 240) state.frameTimeSamples.shift();

  state.fpsMin = Math.min(state.fpsMin, fps);
  state.fpsMax = Math.max(state.fpsMax, fps);

  if(state.started&&state.phase!=='summary'&&state.phase!=='intro'){
    state.frameRun.push(frameMs);state.frameSeconds+=rawDt;
    state.stageSeconds[state.phase]=(state.stageSeconds[state.phase]||0)+rawDt;
    if(rawDt>.05)state.longFrames++;
  }

  if(state.phase === 'dualdrag'){
    state.dualdragElapsed += rawDt;
    if(state.pointerCountNow >= 2) state.dualSimTime += rawDt;
  }

  if(state.pointerCountNow > 0){
    state.multiTouchHoldTimer += rawDt;
    if(state.multiTouchHoldTimer >= CFG.stableMultiHoldSec){
      state.stableMultiTouchMax = Math.max(state.stableMultiTouchMax, state.pointerCountNow);
    }
  } else {
    state.multiTouchHoldTimer = 0;
  }

  for(const p of state.particles){
    p.y += p.s * dt;
    if(p.y > state.vh + p.r){
      p.y = -p.r;
      p.x = Math.random() * state.vw;
    }
  }

  const now = performance.now();
  updateZoneCombos(now);
  while(state.inputMarks.length && now - state.inputMarks[0].t > CFG.touchMarkMs) state.inputMarks.shift();

  const prevSec = Math.floor(state.phaseElapsed - rawDt);
  const currSec = Math.floor(state.phaseElapsed);
  if(currSec !== prevSec){
    rollZoneBins();
    rollMultitouchBin();

    state.moveBins.push(state.moveCounter);
    while(state.moveBins.length > CFG.graphSeconds) state.moveBins.shift();
    state.moveCounter = 0;

    state.frameTimeBins.push(Math.round(avg(state.frameTimeSamples.slice(-60))));
    while(state.frameTimeBins.length > CFG.graphSeconds) state.frameTimeBins.shift();
  }

  if(state.phase === 'latency'){
    state.latencyTarget.x += Math.sin(state.phaseElapsed * 0.28) * 0.0007 * state.difficulty * dt * 60;
    state.latencyTarget.y += Math.cos(state.phaseElapsed * 0.21) * 0.0005 * state.difficulty * dt * 60;
    state.latencyTarget.x = clamp(state.latencyTarget.x,.14,.86);
    state.latencyTarget.y = clamp(state.latencyTarget.y,.24,.84);
  }

  if(state.phase === 'dualdrag'){
    const t = state.totalElapsed;
    state.gateLeft.x = .25 + Math.sin(t * 0.95) * 0.03;
    state.gateLeft.y = .44 + Math.cos(t * 1.10) * 0.035;
    state.gateRight.x = .75 + Math.sin(t * 1.02 + 1.2) * 0.03;
    state.gateRight.y = .44 + Math.cos(t * 1.25 + .6) * 0.035;

    const gateR=CFG.gateR*state.scale*.92;
    const li=state.leftCursor.active!==null&&hypot2((state.leftCursor.x-state.gateLeft.x)*state.vw,(state.leftCursor.y-state.gateLeft.y)*state.vh)<=gateR;
    const ri=state.rightCursor.active!==null&&hypot2((state.rightCursor.x-state.gateRight.x)*state.vw,(state.rightCursor.y-state.gateRight.y)*state.vh)<=gateR;

    state.leftCursor.overGate = li;
    state.rightCursor.overGate = ri;
    if(li && ri) state.dualHoldTime += rawDt;
  }

  if(state.phase === 'falling'){
    state.falling.spawnTimer += dt;
    const interval = Math.max(.22, CFG.fallingSpawn - state.difficulty * 0.04);
    while(state.falling.spawnTimer >= interval){
      state.falling.spawnTimer -= interval;
      spawnFallingCircle();
    }
    for(let i=state.falling.circles.length-1;i>=0;i--){
      const c = state.falling.circles[i];
      // speed уже в пикселях в секунду (пересчитан при спавне)
      c.y += c.speed * dt;
      if(c.y - c.r > state.vh){
        state.falling.misses++;
        state.falling.circles.splice(i,1);
      }
    }
  }

  if(state.phase === 'autodiag'){
    updateAutoDiag(rawDt);
  }

}
function spawnFallingCircle(){
  const safeMin = 0.08;
  const safeMax = 0.92;
  const safeSpan = safeMax - safeMin;

  // Смещаем распределение вправо, чтобы быстрые зоны получали больше целей. Значение 0.65. Пока сделал 0.5 для более равного распределения. левая зона ~33% целей
  const speedBiasExponent = 0.5;
  const biased = Math.pow(Math.random(), speedBiasExponent);
  const xSafeNorm = biased;
  const xNorm = safeMin + xSafeNorm * safeSpan;

  const r = (CFG.fallingMinR + Math.random() * (CFG.fallingMaxR - CFG.fallingMinR)) * state.scale;

  // СКОРОСТЬ В ПРОЦЕНТАХ ВЫСОТЫ ЭКРАНА В СЕКУНДУ
  const percentPerSec = CFG.fallingSpeedMinPercent + xSafeNorm * (CFG.fallingSpeedMaxPercent - CFG.fallingSpeedMinPercent);
  // Преобразуем в пиксели в секунду с учётом текущей высоты экрана
  const speed = (percentPerSec / 100) * state.vh;

  let bandSpeed = 'medium';
  if(xSafeNorm < 0.33) bandSpeed = 'slow';
  else if(xSafeNorm > 0.66) bandSpeed = 'fast';

  let bandSize = 'mediumSize';
  const minR = CFG.fallingMinR * state.scale;
  const maxR = CFG.fallingMaxR * state.scale;
  const t = (r - minR) / Math.max(1, maxR - minR);
  if(t < 0.33) bandSize = 'small';
  else if(t > 0.66) bandSize = 'large';

  state.falling.circles.push({
    x: xNorm * state.vw,
    y: -80 * state.scale,
    r,
    speed,
    percentPerSec,  // сохраняем для отображения
    bandSpeed,
    bandSize,
    xSafeNorm
  });

  state.falling.spawned++;
  state.falling[bandSpeed].spawned++;
  state.falling[bandSize].spawned++;
}



function draw(){
  updateReadouts();
  if(state.phase === 'autodiag'){
    drawStars();
    drawAutoDiagWorld();

    const cfg = getVisualModeConfig();
    if(cfg.hudEnabled){
      drawAutoDiagHud();
    } else {
      hctx.clearRect(0,0,state.vw,state.vh);
    }

    updateReadouts();
    return;
  }

  const cfg = getVisualModeConfig();

  drawStars();
  drawWorld();

  if(cfg.hudEnabled){
    drawHud();
  } else {
    hctx.clearRect(0,0,state.vw,state.vh);
  }
}


function drawStars(){
  sctx.clearRect(0,0,state.vw,state.vh);

  const cfg = getVisualModeConfig();
  if(state.phase === 'lightscene') return;
  if(!cfg.starsEnabled) return;

  const pixelScale=Math.max(.000001,Math.min(dom.stars.width/state.vw,dom.stars.height/state.vh));
  for(const p of state.particles){
    sctx.globalAlpha = p.a;
    sctx.fillStyle = '#d9eeff';
    sctx.beginPath();
    const radius=pixelScale<1?Math.max(p.r,.70/pixelScale):p.r;
    sctx.arc(p.x,p.y,radius,0,Math.PI*2);
    sctx.fill();
  }
  sctx.globalAlpha = 1;
}




function drawWorld(){
  wctx.clearRect(0,0,state.vw,state.vh);
  if(state.phase==='latency') drawLatencyWorld();
  if(state.phase==='tapzones') drawTapZonesWorld();
  if(state.phase==='dualdrag') drawDualWorld();
  if(state.phase==='multitouch') drawMultitouchWorld();
  if(state.phase==='falling') drawFallingWorld();
  if(state.phase==='lightscene') drawLightSceneWorld();

function drawPathLine(path, color, width, crisp = false){
  if(!path || path.length < 2) return;

  wctx.strokeStyle = color;
  wctx.lineWidth = width;
  wctx.lineCap = crisp ? 'butt' : 'round';
  wctx.lineJoin = crisp ? 'miter' : 'round';
  wctx.miterLimit = 2;

  wctx.beginPath();
  for(let i=0;i<path.length;i++){
    const p = path[i];
    if(i === 0) wctx.moveTo(p.x, p.y);
    else wctx.lineTo(p.x, p.y);
  }
  wctx.stroke();
}

function drawTracePathWorld(){
  drawPathLine(state.trace.path, 'rgba(102,222,255,.14)', CFG.traceGuideWidth * state.scale);
  drawPathLine(state.trace.path, 'rgba(255,255,255,.72)', 4 * state.scale);

  if(state.trace.points.length > 1){
    drawPathLine(state.trace.points, 'rgba(255,184,107,.95)', 4 * state.scale, true);

    for(let i=0;i<state.trace.points.length;i++){
      const p = state.trace.points[i];
      wctx.fillStyle='rgba(255,245,220,.95)';
      wctx.beginPath();
      wctx.arc(p.x, p.y, 5 * state.scale, 0, Math.PI * 2);
      wctx.fill();
    }
  }

  const start = state.trace.path[0];
  const end = state.trace.path[state.trace.path.length - 1];

  wctx.fillStyle='rgba(127,244,181,.95)';
  wctx.beginPath();
  wctx.arc(start.x, start.y, 18 * state.scale, 0, Math.PI * 2);
  wctx.fill();

  wctx.fillStyle='rgba(255,107,122,.95)';
  wctx.beginPath();
  wctx.arc(end.x, end.y, 18 * state.scale, 0, Math.PI * 2);

function drawBarChart(x,y,w,h,title,bins,current,color,rowIndex=0){
  const pos = fitAuxPanelRect(x,y,w,h,rowIndex);
  x = pos.x; y = pos.y;

  drawGlass(x,y,w,h);
  const s=state.scale, px=x+14*s, py=y+36*s, pw=w-28*s, ph=h-50*s;
  hctx.fillStyle='rgba(159,180,204,.95)';
  hctx.font=`800 ${Math.round(16*s)}px Inter,system-ui,sans-serif`;
  hctx.fillText(title,x+14*s,y+24*s);

  const arr=[...bins.slice(-(CFG.graphSeconds-1)), current];
  const max=Math.max(3,...arr);
  const barW=pw/arr.length*.72;

  arr.forEach((v,i)=>{
    const xx=px+i*(pw/arr.length)+(pw/arr.length-barW)/2;
    const bh=(v/max)*ph;
    hctx.fillStyle=hexToRgba(color,.8);
    hctx.fillRect(xx,py+ph-bh,barW,bh);
  });

  hctx.fillStyle='#eef6ff';
  hctx.font=`900 ${Math.round(22*s)}px Inter,system-ui,sans-serif`;

function fitAuxPanelRect(x,y,w,h,rowIndex=0){

    hctx.stroke();

    hctx.strokeStyle=c3;
    hctx.lineWidth=5.2*s;
    hctx.beginPath();
    hctx.arc(x,y,94*s,0,Math.PI*2);
    hctx.stroke();
  }
}




function drawDualProgress(){
  const s=state.scale, w=520*s, h=24*s, x=state.cx-w/2, y=state.vh-134*s;
  drawGlass(x-8*s,y-8*s,w+16*s,h+16*s);
  roundRect(hctx,x,y,w,h,999*s,'rgba(255,255,255,.07)','rgba(255,255,255,.1)');
  const ratio=clamp(state.dualHoldTime/Math.max(.001,state.dualdragElapsed||1),0,1);
  roundRect(hctx,x,y,w*ratio,h,999*s,'rgba(127,244,181,.88)',null);

  const leftAvg = state.leftCursor.samples ? state.leftCursor.sumFingerLag / state.leftCursor.samples : 0;
  const rightAvg = state.rightCursor.samples ? state.rightCursor.sumFingerLag / state.rightCursor.samples : 0;

  hctx.fillStyle='#eef6ff';
  hctx.font=`900 ${Math.round(20*s)}px Inter,system-ui,sans-serif`;
  hctx.textAlign='center';
  hctx.fillText(`Совместное удержание: ${Math.round(ratio*100)}%`,state.cx,y-14*s);

  hctx.font=`800 ${Math.round(16*s)}px Inter,system-ui,sans-serif`;
  hctx.fillText(`Lag L: ${Math.round(leftAvg)} px · Lag R: ${Math.round(rightAvg)} px`,state.cx,y+52*s);
  hctx.textAlign='left';
}








function drawTapZoneCounters(){
  const s=state.scale, narrow=isNarrowScreen();
  const x=24*s, y=narrow?230*s:206*s, w=narrow?250*s:220*s, h=118*s, gap=12*s;
  const left=state.tapZones.left, right=state.tapZones.right;
  drawZoneCounterBox(x,y,w,h,'ЛЕВАЯ','#66deff',left);

function drawZoneCounterBox(x,y,w,h,label,color,z){
  drawGlass(x,y,w,h);
  const s=state.scale;
  hctx.fillStyle=color;
  hctx.font=`900 ${Math.round(18*s)}px Inter,system-ui,sans-serif`;
  hctx.fillText(label,x+14*s,y+22*s);

  hctx.font=`900 ${Math.round(34*s)}px Inter,system-ui,sans-serif`;
  hctx.fillText(`${z.combo}`,x+14*s,y+62*s);
  hctx.font=`800 ${Math.round(15*s)}px Inter,system-ui,sans-serif`;
  hctx.fillStyle='rgba(159,180,204,.96)';
  hctx.fillText(`серия`,x+82*s,y+42*s);
  hctx.fillText(`лучшая ${z.best}`,x+82*s,y+62*s);
  hctx.fillText(`всего ${z.total}`,x+82*s,y+82*s);
}

function summarize(forcedFail){
  const med = state.latencySamples.length?median(state.latencySamples):null;
  const p95 = state.latencySamples.length?percentile(state.latencySamples,.95):null;
  const avgF = state.frameSeconds?state.frameRun.length/state.frameSeconds:0;
  const minF = state.frameRun.length?1000/state.frameRun.reduce((m,v)=>Math.max(m,v),0):0;
  const p95Frame = state.frameRun.length?percentile(state.frameRun,.95):null;

  const dualRatio = state.dualHoldTime / Math.max(1e-6, state.dualdragElapsed || 1);
  const fallRatio = state.falling.spawned ? state.falling.hits / state.falling.spawned : 0;

  const leftLagAvg = state.leftCursor.samples ? state.leftCursor.sumFingerLag / state.leftCursor.samples : null;
  const rightLagAvg = state.rightCursor.samples ? state.rightCursor.sumFingerLag / state.rightCursor.samples : null;

  const traceAvgDev = state.trace.deviationSamples ? state.trace.deviationSum / state.trace.deviationSamples : null;
  const dualLeftAvg = state.dualpaths.left.deviationSamples ? state.dualpaths.left.deviationSum / state.dualpaths.left.deviationSamples : null;
  const dualRightAvg = state.dualpaths.right.deviationSamples ? state.dualpaths.right.deviationSum / state.dualpaths.right.deviationSamples : null;

  const latencyScore = med <= CFG.goodLatency ? 1 : med <= CFG.okLatency ? .5 : 0;
  const fpsScore = avgF >= CFG.goodFps ? 1 : avgF >= CFG.okFps ? .5 : 0;
  const jankScore = state.longFrames <= CFG.goodLongFrames ? 1 : state.longFrames <= CFG.okLongFrames ? .5 : 0;
  const dualScore = (state.maxSimultaneousPointers >= 2 && state.dualSimTime >= CFG.dualNeedSimSec && dualRatio >= CFG.dualNeedRatio) ? 1 : 0;
  const tapScore = (state.tapZones.left.bestPerSec >= 5 && state.tapZones.right.bestPerSec >= 5) ? 1 : .5;
  const multiScore = state.stableMultiTouchMax >= CFG.touchGood ? 1 : state.maxSimultaneousPointers >= 2 ? .5 : 0;
  const fallScore = fallRatio >= CFG.fallNeedRatio ? 1 : fallRatio >= .2 ? .5 : 0;
  const traceScore = state.trace.completed && (state.trace.normalDeviationSum||0)/Math.max(1,state.trace.deviationSamples) < 80 ? 1 : state.trace.progress > .65 ? .5 : 0;
  const dualPathScore = (state.dualpaths.left.progress > .65 && state.dualpaths.right.progress > .65 && (state.dualpaths.left.normalDeviationSum||0)/Math.max(1,state.dualpaths.left.deviationSamples) < 90 && (state.dualpaths.right.normalDeviationSum||0)/Math.max(1,state.dualpaths.right.deviationSamples) < 90) ? 1 : state.dualpaths.left.progress>0&&state.dualpaths.right.progress>0?.5:0;

  const env = collectEnvironmentSnapshot();
  const refreshHzEstimate = estimateRefreshHzFromSamples();

  const touchSeen=state.inputTypes.has('touch');
  const multiple=touchSeen&&(navigator.maxTouchPoints>=2||state.maxSimultaneousPointers>=2);
  const rows=[
    ['Обработка события',med!==null,latencyScore,.14],
    ['Частота кадров',state.frameRun.length>0,fpsScore,.12],
    ['Длинные кадры',state.frameRun.length>0,jankScore,.10],
    ['Две зоны',state.tapZones.left.total>0&&state.tapZones.right.total>0,tapScore,.12],
    ['Два круга',multiple&&!!state.stageInputs.dualdrag,dualScore,.14],
    ['Мультитач',multiple&&!!state.stageInputs.multitouch,multiScore,.10],
    ['Падающие цели',!!state.stageInputs.falling,fallScore,.10],
    ['Траектория',!!state.trace.deviationSamples,traceScore,.09],
    ['Две траектории',multiple&&!!state.dualpaths.left.deviationSamples&&!!state.dualpaths.right.deviationSamples,dualPathScore,.09]
  ];
  const applicable=rows.filter((_,i)=>multiple||![4,5,8].includes(i));
  const measured=applicable.filter(r=>r[1]);const complete=measured.length===applicable.length;
  const weight=measured.reduce((v,r)=>v+r[3],0);
  const final=weight?measured.reduce((v,r)=>v+r[2]*r[3],0)/weight:0;
  const result=!forcedFail&&complete&&final>=.66&&(!multiple||dualScore===1)?1:0;
  const assessment=forcedFail||!complete?'incomplete':result?'passed':'review';
  let verdict=assessment==='incomplete'?'Не все применимые этапы проверены. По пропущенным этапам выводов нет.':result?'Проверенные показатели соответствуют порогам приложения.':'Часть показателей ниже порогов приложения. Повторите проверку: результат зависит и от действий пользователя.';
  if(!multiple)verdict+=' Одновременное управление несколькими касаниями не проверено; мышь и перо не подтверждают мультитач.';
  const checks=rows.map((r,i)=>{
    const unavailable=!multiple&&[4,5,8].includes(i),measured=!unavailable&&r[1];
    const severity=!measured?'warning':r[2]===0?'problem':r[2]<1?'warning':'normal';
    const status=unavailable?'не проверено (нужны несколько касаний)':!measured?'не проверено':severity==='problem'?'ниже порога':severity==='warning'?'предупреждение':'в пределах порогов';
    return {label:r[0],measured,severity,text:r[0]+': '+status};
  });
  const coverage=checks.map(check=>check.text);

  const autoDiagResults = (state.autoDiag && state.autoDiag.results)
    ? state.autoDiag.results.map(r => ({ ...r }))
    : [];

  const autoDiagSummary = autoDiagResults.length
    ? autoDiagResults.map(r => `${r.title}: ${Math.round(r.avgFps)}`).join(' | ')
    : '';

  const autoDiagVerdict = state.autoDiag?.verdict
    ? state.autoDiag.verdict
    : analyzeAutoDiagResults(autoDiagResults);

  return {
    result,assessment,coverage,checks,inputTypes:[...state.inputTypes],frameCount:state.frameRun.length,
    medianLatency:med,
    p95Latency:p95,
    avgFps:avgF,
    minFps:minF,
    p95Frame,
    longFrames:state.longFrames,
    maxPointers:state.maxSimultaneousPointers,
    stablePointers:state.stableMultiTouchMax,
    dualHoldRatio:dualRatio,

    leftBest:state.tapZones.left.best,
    rightBest:state.tapZones.right.best,
    leftTotal:state.tapZones.left.total,
    rightTotal:state.tapZones.right.total,
    simultaneousZoneHits:state.simultaneousZoneHits,

    fallHits:state.falling.hits,
    fallSpawned:state.falling.spawned,

    leftLagAvg,
    rightLagAvg,

    traceProgress:state.trace.progress,
    traceAvgDeviation:traceAvgDev,
    traceBreaks:state.trace.breaks,
    traceCapturePoints:state.trace.capturePoints,

    dualPathLeftProgress:state.dualpaths.left.progress,
    dualPathRightProgress:state.dualpaths.right.progress,
    dualPathLeftDeviation:dualLeftAvg,
    dualPathRightDeviation:dualRightAvg,

    verdict,

    viewport: env.viewport,
    screen: env.screen,
    devicePixelRatio: env.devicePixelRatio,
    hardwareConcurrency: env.hardwareConcurrency,
    maxTouchPoints: env.maxTouchPoints,
    colorDepth: env.colorDepth,
    webglVendor: env.webglVendor,
    webglRenderer: env.webglRenderer,
    refreshHzEstimate,
    userAgent: env.userAgent,

    autoDiagResults,
    autoDiagSummary,
    autoDiagVerdict
  };
}

function loop(ts){
  if(document.hidden){state.lastFrame=0;requestAnimationFrame(loop);return;}
  if(!state.lastFrame){state.lastFrame=ts;draw();requestAnimationFrame(loop);return;}

  const rawDt = Math.max(0.001, (ts - state.lastFrame) / 1000);
  state.lastFrame = ts;

  const simDt = clamp(rawDt, .001, .05);

  update(simDt, rawDt);
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('resize',scheduleResize);
if(window.visualViewport)visualViewport.addEventListener('resize',scheduleResize);

function makeTouchPointerEvent(nativeEvent, touch){
  return {
    target: document.elementFromPoint(touch.clientX, touch.clientY) || dom.game,
    clientX: touch.clientX,
    clientY: touch.clientY,
    pointerId: `touch-${touch.identifier}`,
    pointerType: 'touch',type:nativeEvent.type,
    timeStamp: typeof nativeEvent.timeStamp === 'number' ? nativeEvent.timeStamp : performance.now(),
    cancelable: !!nativeEvent.cancelable,
    preventDefault(){},
    stopPropagation(){}
  };
}

function makeMousePointerEvent(nativeEvent){
  return {
    target: nativeEvent.target || dom.game,
    clientX: nativeEvent.clientX,
    clientY: nativeEvent.clientY,
    pointerId: 'mouse',
    pointerType: 'mouse',button:nativeEvent.button,type:nativeEvent.type,
    timeStamp: typeof nativeEvent.timeStamp === 'number' ? nativeEvent.timeStamp : performance.now(),
    cancelable: !!nativeEvent.cancelable,
    preventDefault(){},
    stopPropagation(){}
  };
}

if(HAS_POINTER_EVENTS){
  dom.game.addEventListener('pointerdown', onPointerDown, { passive:false });
  dom.game.addEventListener('pointermove', onPointerMove, { passive:false });
  dom.game.addEventListener('pointerup', onPointerUp, { passive:false });
  dom.game.addEventListener('pointercancel',onPointerUp,{passive:false});
  dom.game.addEventListener('lostpointercapture',onPointerUp,{passive:false});
} else {
  dom.game.addEventListener('touchstart', e => {
    if(isUiTarget(e.target))return;
    if(e.cancelable) e.preventDefault();
    for(const touch of e.changedTouches){
      onPointerDown(makeTouchPointerEvent(e, touch));
    }
  }, { passive:false });

  dom.game.addEventListener('touchmove', e => {
    if(e.cancelable) e.preventDefault();
    for(const touch of e.changedTouches){
      onPointerMove(makeTouchPointerEvent(e, touch));
    }
  }, { passive:false });

  dom.game.addEventListener('touchend', e => {
    if(e.cancelable) e.preventDefault();
    for(const touch of e.changedTouches){
      onPointerUp(makeTouchPointerEvent(e, touch));
    }
  }, { passive:false });

  dom.game.addEventListener('touchcancel', e => {
    if(e.cancelable) e.preventDefault();
    // Each known contact is counted once by onPointerUp.
    for(const touch of e.changedTouches){
      onPointerUp(makeTouchPointerEvent(e, touch));
    }
  }, { passive:false });

  dom.game.addEventListener('mousedown', e => {
    if(e.cancelable) e.preventDefault();
    onPointerDown(makeMousePointerEvent(e));
  }, { passive:false });

  window.addEventListener('mousemove', e => {
    onPointerMove(makeMousePointerEvent(e));
  }, { passive:false });

  window.addEventListener('mouseup', e => {
    onPointerUp(makeMousePointerEvent(e));
  }, { passive:false });
}
window.addEventListener('blur',()=>{releasePointers();state.lastFrame=0});
document.addEventListener('visibilitychange',()=>{releasePointers();state.lastFrame=0});
window.addEventListener('message', e => {
  if(!e.data || e.data.type !== 'gameInit') return;
  initFromParams(e.data);
});

window.addEventListener('beforeunload', () => {
  if(!state.finishSent){
    try{
      parent.postMessage({ type:'gameResult', result:0 }, '*');
    }catch(_){}
  }
});


const stats=document.getElementById('stats'),heading=document.querySelector('#stage-heading h1'),hint=document.querySelector('#stage-heading p');
const facts=document.getElementById('stage-facts'),inputInfo=document.getElementById('input-info');
const statValues=['FPS','Кадр','Обработка','Касания','Движ/с','Нажатия'].map((label,i)=>{
 const el=document.createElement('div');el.className='stat'+(i>1?' secondary':'');el.innerHTML='<small>'+label+'</small><strong>—</strong>';stats.appendChild(el);return el.lastChild;
});
stats.appendChild(qualityButton);stageControls.id='controls';dom.game.appendChild(stageControls);
const readouts=document.getElementById('readouts');readouts.dataset.ui='true';document.getElementById('stage-heading').dataset.ui='true';stats.dataset.ui='true';
let uiTime=0,resizePending=false;
function scheduleResize(){if(resizePending)return;resizePending=true;requestAnimationFrame(()=>{resizePending=false;resize()})}
const layoutObserver=typeof ResizeObserver==='function'?new ResizeObserver(scheduleResize):null;
if(layoutObserver)layoutObserver.observe(document.getElementById('playfield'));
function updateReadouts(){
 const now=performance.now();if(now-uiTime<100)return;uiTime=now;
 qualityButton.disabled=stageBtns.bg.disabled=state.phase==='autodiag';
 heading.textContent=STAGE_TITLES[state.phase]||'Диагностика экрана';hint.textContent=STAGE_HINTS[state.phase]||'Касания, мышь, точность ввода и производительность';
 stageBtns.resetTrace.style.display=state.phase==='tracepath'?'inline-flex':'none';stageBtns.resetDualPaths.style.display=state.phase==='dualpaths'?'inline-flex':'none';
 const values=[fmtFps(state.fpsDisplay||state.fpsValue),fmtMs(state.lastFrameTimeMs),state.latencySamples.length?fmtMs(state.lastInputLatency):'—',state.pointerCountNow,state.moveBins.at(-1)||state.moveCounter,state.totalPresses];
 values.forEach((v,i)=>{statValues[i].textContent=v});
 let detail='';
 if(state.phase==='latency')detail='Попадания: '+state.latencyTarget.hits+' · Промахи: '+state.latencyTarget.misses;
 if(state.phase==='tapzones')detail='Левая: '+state.tapZones.left.total+' (серия '+state.tapZones.left.combo+') · Правая: '+state.tapZones.right.total+' (серия '+state.tapZones.right.combo+') · Вместе: '+state.simultaneousZoneHits;
 if(state.phase==='dualdrag')detail='Совместное удержание: '+Math.round(state.dualHoldTime/Math.max(.001,state.dualdragElapsed)*100)+'% · Отмены ввода: '+state.pointerCancelCount;
 if(state.phase==='multitouch')detail='Касаний сейчас: '+state.pointerCountNow+' · Максимум: '+state.maxSimultaneousPointers+' · Стабильно 1 с: '+state.stableMultiTouchMax;
 if(state.phase==='falling')detail='Попадания: '+state.falling.hits+'/'+state.falling.spawned+' · Медленные: '+state.falling.slow.hits+' · Средние: '+state.falling.medium.hits+' · Быстрые: '+state.falling.fast.hits;
 if(state.phase==='tracepath')detail='Пройдено: '+Math.round(state.trace.progress*100)+'% · Отклонение: '+(state.trace.deviationSamples?Math.round(state.trace.deviationSum/state.trace.deviationSamples)+' px':'—')+' · Разрывы: '+state.trace.breaks;
 if(state.phase==='dualpaths')detail='Левая: '+Math.round(state.dualpaths.left.progress*100)+'% · Правая: '+Math.round(state.dualpaths.right.progress*100)+'% · Разрывы: '+state.dualpaths.left.breaks+'/'+state.dualpaths.right.breaks;
 if(state.phase==='autodiag')detail='Автоматически: '+(getAutoDiagCase()?.title||'подготовка')+' · осталось '+getAutoDiagRemainingSec().toFixed(1)+' с · '+state.autoDiag.results.map(r=>r.title+': '+Math.round(r.avgFps)+' FPS').join(' · ');
 facts.textContent=detail||'Базовая частота кадров без действий';
 inputInfo.textContent='Ввод: '+([...state.inputTypes||[]].join(', ')||'ещё не определён')+' · Обработка события: '+(state.latencySamples.length?fmtMs(state.lastInputLatency):'не измерена')+' · Движений/с: '+(state.moveBins.at(-1)||0)+' · Нажатий: '+state.totalPresses;
 drawHistory();
}
function drawHistory(){
 const c=document.getElementById('history');
 const r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);if(!r.width||!r.height)return;
 if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}
 const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);
  const series=[['FPS',state.fpsSamples,'#66deff'],['Кадр, мс',state.frameTimeSamples,'#ffd166'],['Ввод, мс',state.latencySamples,'#ff87dc']];
 const width=r.width/3;
 series.forEach(([label,data,color],i)=>{const x=i*width+4,p=data.slice(-100),max=Math.max(1,...p);ctx.fillStyle=color;ctx.font=Math.max(11,Math.min(28,r.height*.18))+'px system-ui';ctx.fillText(label,x,Math.max(14,r.height*.2));ctx.beginPath();p.forEach((v,j)=>{const xx=x+j/Math.max(1,p.length-1)*(width-10),yy=r.height-4-v/max*(r.height*.6);if(j)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy)});ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke()});
}
resize();
requestAnimationFrame(loop);

// fallback для прямого запуска файла без движка новеллы
setTimeout(() => {
  if(state.initialized) return;

  initFromParams({
    type: 'gameInit',
    gameId: 'screenBenchmark',
    difficulty: 3
  });
}, 60);
})();
