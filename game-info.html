<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Об игре — Игры Ильи Барило</title><meta name="description" content="Краткая информация и запуск игры из коллекции Ильи Барило."><link rel="icon" href="assets/favicon.png"><style>
body{margin:0;background:#0b1924;color:#eef9f5;font:17px/1.65 'Segoe UI',sans-serif}main{max-width:820px;margin:60px auto;padding:0 24px}a,button{color:#cef3a1}button{background:#18343c;border:1px solid #729288;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}h1{line-height:1.2}img{max-width:310px;width:100%;border-radius:12px}small{color:#b4c7c9}.play{display:inline-block;background:#c4ec97;color:#1a3629;padding:9px 22px;border-radius:8px;text-decoration:none;font-weight:700}
</style></head><body><main><button id="back">← Вернуться в павильон</button><h1 id="title">Об игре</h1><small id="genre"></small><p id="description"></p><img id="preview" alt="" hidden><p><a id="play" class="play" hidden>Играть</a></p><p><a href="usage.html">Как скачать и играть</a> · <a href="terms.html">Условия использования</a> · <a href="third-party.html">Сторонние лицензии</a></p></main><script src="catalog/games.js"></script><script>
const g=window.GAMES_CATALOG.games.find(g=>g.id===new URLSearchParams(location.search).get('id'));
document.getElementById('back').onclick=()=>{if(history.length>1)history.back();else location.href='index.html'};
if(g){document.title=g.title+' — об игре';document.getElementById('title').textContent=g.title;document.getElementById('genre').textContent=g.genre;document.getElementById('description').textContent=g.description;const img=document.getElementById('preview');img.src=''+g.imageUrl;img.alt=g.title;img.hidden=false;const play=document.getElementById('play');play.href=''+g.link;play.hidden=false}else document.getElementById('description').textContent='Игра не найдена.';
</script></body></html>
